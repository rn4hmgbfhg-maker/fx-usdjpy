%YAML 1.2
---
# ============================================================================
# FXドル円 半自動売買スキーム — Cowork（クラウド）運用マニフェスト
#
# このファイルが仕様の正本。スキル・ルーティン・データ経路・受入基準を集約する。
# 変更するときは必ずここを直してから各 SKILL.md へ反映すること
# （同じ数字・同じ手順を2箇所で別々に持つと片方だけ直し残る）。
# ============================================================================

manifest:
  name: fx-usdjpy-cowork
  version: 1.0.0
  作成: 2026-08-18
  所有者: 落合康友 (yasu7625@gmail.com)
  目的: >-
    Macのlaunchdに依存していたFXドル円半自動売買スキームを、Coworkから
    操作・監視できる形に移行する。判定はGitHub Actionsが行い、Coworkは
    その確定結果を読んで発注カードを提示し、通知する。
  原則:
    - JFX(MATRIX TRADER)はEA・外部プログラムによる自動発注が規約で禁止。
      本パッケージは「判定結果の提示」までを担い、発注は必ず本人が手動で行う。
    - Cowork側は一切の売買判定・数値計算をしない。読んで整形して伝えるだけ。
    - 数字が無い・古い・取得できないときは、推測で埋めず「無い」と報告する。

# ----------------------------------------------------------------------------
# 1. 実行環境の制約（2026-08-14 実測。ここを誤ると設計から崩れる）
# ----------------------------------------------------------------------------
制約:
  クラウドegress:
    許可:
      - raw.githubusercontent.com   # 判定結果の読み取り経路（本パッケージの生命線）
      - PyPI                        # pip install は通る
      - WebSearch                   # サーバ側実行のため制限を受けない
      - PushNotification            # スマホ到達を実証済み
    遮断:
      - query1.finance.yahoo.com    # EGRESS_BLOCKED（実測）
      - nfs.faireconomy.media       # Forex Factory
      - open.er-api.com             # 為替API全般
    帰結: >-
      クラウドから相場データを直接取りに行く設計は成立しない。
      データ取得と判定はGitHub Actions（外向き自由）に置き、Coworkは
      raw.githubusercontent.com からその結果を読むだけにする。
  api_github_com: >-
    api.github.com は未検証のため使わない。鮮度判定はコミットAPIではなく、
    結果JSON内の「更新」「updated」フィールドで行う（raw経由で完結する）。
  書き込み: >-
    Coworkからリポジトリへのpush・stateの書き換えは行わない（読み取り専用）。
    デイトレの「未通知」キューを既読化できないため、重複通知は時刻の窓で防ぐ。

# ----------------------------------------------------------------------------
# 2. データ経路
# ----------------------------------------------------------------------------
データ経路:
  方式: GitHub Actions 方式（モードA・完全クラウド・Mac不要）
  リポジトリ: rn4hmgbfhg-maker/fx-usdjpy
  可視性: public
  ブランチ: main
  raw_base: https://raw.githubusercontent.com/rn4hmgbfhg-maker/fx-usdjpy/main
  取得口: scripts/fx_fetch.py    # 全スキルはこのスクリプト経由で読む（直接curlしない）
  更新間隔: 15分（Actions fx-signals が毎時 5,20,35,50分に実行）

  読むファイル:
    - path: state.json
      内容: 日足2システム（長期トレンド／短期スイング）の建玉・逆指値
    - path: state_intraday.json
      内容: デイトレ複合時間軸2Hの建玉・逆指値・利確
    - path: state_intraday15.json
      内容: デイトレ15分の建玉・逆指値・利確
    - path: results/intraday_status.json
      内容: 2Hの最新アクション・未通知キュー・更新時刻（鮮度判定に使う）
    - path: results/intraday15_status.json
      内容: 15分の同上
    - path: results/orders/YYYY-MM-DD_指示_{速報1|速報2|確定}.txt
      内容: 日足2システムの指示書本文（発注カードを含む）
    - path: results/orders/YYYY-MM-DD_発注_{段階}.json
      内容: 同・機械可読版（幅pipsの数値キーを含む）
    - path: results/intraday_latest.txt
      内容: 2Hの最新指示書（発注カード込み）
    - path: results/intraday15_latest.txt
      内容: 15分の最新指示書（発注カード込み）
    - path: results/research_log.csv
      内容: 日次研究（パラメータ自動進化）の履歴
    - path: results/pair_scan_log.csv
      内容: 週次ペア横断研究の履歴
    - path: results/forecast_log.csv
      内容: ファンダメンタル予測の履歴
    - path: results/daily_log.csv
      内容: 日次の実現損益・資産推移

  鮮度:
    しきい値分: 60        # これを超えて更新が無ければ Actions 停止を疑う
    休場除外: 土13:00 JST 〜 月06:00 JST は警告しない
    警告先: PushNotification（fx-watch ルーティンが担当）

# ----------------------------------------------------------------------------
# 3. 運用中のシステム（パラメータの正本は config.json。ここは参照用の写し）
# ----------------------------------------------------------------------------
システム:
  - 名称: 長期トレンド
    区分: 日足
    戦略: ドンチャン40/10
    ATRストップ係数: 3.5
    リスク率: 0.010
    レバ上限: 1.5
    利確指値: なし          # トレンド追随。決済はトレイル逆指値
    判定時刻: JST 6/7/8時台（速報1→速報2→最終確定）
    発注可: 最終確定のみ
  - 名称: 短期スイング
    区分: 日足
    戦略: ドンチャン20/8
    ATRストップ係数: 1.5
    リスク率: 0.005
    レバ上限: 1.5
    利確指値: なし
    判定時刻: JST 6/7/8時台
    発注可: 最終確定のみ
  - 名称: デイトレ複合時間軸
    区分: 2時間足（4Hフィルタ30・確認MACD順行）
    戦略: ドンチャンMTF 12/6
    ATRストップ係数: 3.0
    利確ATR係数: 6.0
    リスク率: 0.004
    レバ上限: 1.5
    利確指値: あり（OCO）
    判定間隔: 15分ごと（確定バー更新時のみアクション）
    試験運転: true
  - 名称: デイトレ15分
    区分: 1時間足
    戦略: ドンチャン24/12・フィルタ無
    ATRストップ係数: 3.0
    利確ATR係数: 6.0
    リスク率: 0.003
    レバ上限: 1.5
    利確指値: あり（OCO）
    判定間隔: 15分ごと
    試験運転: true
    採用日: 2026-08-13

# ----------------------------------------------------------------------------
# 4. 発注カードの表示規約（2026-08-18 ユーザー厳命）
# ----------------------------------------------------------------------------
発注カード規約:
  必須欄:
    - 利確幅 pips
    - 損切り幅 pips
  並び: 利確幅 → 損切り幅（ユーザー文言どおり）
  保有玉の追加欄: 現値から（逆指値まであと何pips・利確まであと何pips）
  計算元: >-
    Actions側 src/risk.py の order_widths() のみ。Coworkでは pips を計算しない。
    指示書テキストの「──── 幅（pips）────」欄をそのまま転記する。
    機械可読JSONを使う場合は 損切り幅pips_数値 / 利確幅pips_数値 /
    現値から逆指値pips_数値 / 現値から利確pips_数値 を読む。
  基準:
    新規建て: 想定約定値（判定バーの終値）からの距離
    保有玉: 建値からの距離（到達時に確定する損益幅）＋現値からの距離を併記
  利確が無い系統の書き方: "—（利確目標を置かない設計）"
  禁止事項:
    - ドンチャンの決済ラインを「利確」と書くこと（トレンド転換で降りる線であり、
      含み損のまま到達すれば損切りとして働く）
    - Cowork側でpipsを暗算・再計算して出すこと
    - 「幅（pips）」欄が無い旧版カードを見て、数値を補完して出すこと
      （その場合はリポジトリのsrcが旧版である旨をそのまま報告する）

# ----------------------------------------------------------------------------
# 5. スキル（Coworkで会話から呼ぶ）
# ----------------------------------------------------------------------------
スキル:
  - name: fx-morning
    path: skills/fx-morning/SKILL.md
    役割: 日足2システムの本日の指示書と発注カードを提示する
    呼び方: 「今日のFX」「朝の指示書」「発注カード出して」
    発注可否: 最終確定のカードのみ発注可。速報段階は明示して止める
  - name: fx-now
    path: skills/fx-now/SKILL.md
    役割: 全4システムの建玉・逆指値・利確までのpips距離・鮮度を一覧する
    呼び方: 「FX現況」「いまのポジション」「あと何pips」
  - name: fx-intraday
    path: skills/fx-intraday/SKILL.md
    役割: デイトレ2系統の直近アクションと発注カードを提示する
    呼び方: 「デイトレ確認」「15分足どう」
  - name: fx-watch
    path: skills/fx-watch/SKILL.md
    役割: Actionsの稼働を鮮度で監視し、停止・失敗を検知して通知する
    呼び方: 「FX見張り」「Actions動いてる？」
  - name: fx-research
    path: skills/fx-research/SKILL.md
    役割: 日次研究・週次ペア研究・ファンダ予測の最新結果を要約する
    呼び方: 「FX研究」「ペア研究の結果」

# ----------------------------------------------------------------------------
# 6. 定時実行（ルーティン）
#    cronはUTC。JSTは+9時間。定義の実体は routines/*.yaml
# ----------------------------------------------------------------------------
ルーティン:
  - name: fx-morning-final
    file: routines/fx-morning-final.yaml
    cron_utc: "20 23 * * 0-4"      # JST 平日 08:20
    内容: 最終確定の発注カードをプッシュ通知。速報段階なら「まだ確定していない」と通知
  - name: fx-intraday-hourly
    file: routines/fx-intraday-hourly.yaml
    cron_utc: "50 * * * 0-5"       # JST 月〜土 毎時59分近辺
    内容: 直近70分以内のデイトレアクションがある時だけ通知（無ければ沈黙）
  - name: fx-watch-hourly
    file: routines/fx-watch-hourly.yaml
    cron_utc: "10 * * * *"         # 毎時 JST 19分
    内容: 鮮度切れ（60分超）を検知した時だけ通知。休場中は沈黙
  - name: fx-research-weekly
    file: routines/fx-research-weekly.yaml
    cron_utc: "0 0 * * 6"          # JST 土 09:00
    内容: 週次ペア研究の結果を要約して通知
  - name: fx-research-daily
    file: routines/fx-research-daily.yaml
    cron_utc: "30 6 * * 1-5"       # JST 平日 15:30
    内容: 日次研究（パラメータ進化）の結果を要約。採用提案があれば判断を仰ぐ

# ----------------------------------------------------------------------------
# 7. 通知方針
# ----------------------------------------------------------------------------
通知:
  手段: "PushNotification（status: proactive）"
  鳴らす: 最終確定の発注アクション／デイトレの新規・決済・ストップ変更／鮮度切れ／週次研究の判定
  鳴らさない: 継続のみの回／速報段階（ただし朝の定時通知では状況を1行で伝える）
  重複防止: >-
    未通知キューは既読化できないため、直近N分（ルーティン間隔+10分）の
    エントリーのみを対象にする。同じidを二度通知しない。
  文面: >-
    先頭に系統名、次にアクション、最後に利確幅・損切り幅pips。
    数字は指示書カードからの転記のみ。200字以内。

# ----------------------------------------------------------------------------
# 8. 受入基準（このパッケージが「完成」と言える条件）
# ----------------------------------------------------------------------------
受入基準:
  - id: A1
    内容: 全データ経路が到達する
    確認コマンド: python3 scripts/fx_fetch.py --selftest
    合格条件: 全経路 OK（未生成の当日ファイルの404は可）
    状態: 合格（2026-08-18 実測）
  - id: A2
    内容: 4システムの建玉・逆指値・利確・鮮度が取れる
    確認コマンド: python3 scripts/fx_fetch.py --status
    合格条件: 4システム全てにポジション・逆指値・鮮度が入る
    状態: 合格（2026-08-18 実測）
  - id: A3
    内容: 発注カードに利確幅・損切り幅pipsが載っている
    確認コマンド: python3 scripts/fx_fetch.py --card
    合格条件: 出力の "pips欄" が true
    状態: >-
      未達。リポジトリのsrcがpips対応前のため。移行手順 M1 を実施すると合格する。
      それまでスキルは「旧版のため幅欄なし」と報告し、数値を自作しない。
  - id: A4
    内容: 鮮度切れを検知できる
    確認方法: FX_STALE_MIN=1 python3 scripts/fx_fetch.py --status
    合格条件: 警告配列に「★N分間 更新がありません」が入る
    状態: 合格（2026-08-18 実測）
  - id: A5
    内容: デイトレの重複通知が起きない
    確認方法: python3 scripts/fx_fetch.py --intraday --since-min 70 を連続実行
    合格条件: 窓の外のidが混ざらない
    状態: 合格（2026-08-18 実測）

# ----------------------------------------------------------------------------
# 9. 移行手順（未実施のものを含む。順に実施する）
# ----------------------------------------------------------------------------
移行手順:
  - id: M1
    作業: pips対応版のsrcをリポジトリへ反映する
    詳細: >-
      Mac側 ~/FXドル円自動売買スキーム/src の risk.py・order_card.py・
      signal_engine.py・intraday_engine.py・intraday15_engine.py を
      リポジトリへコミット＆push する。これを行うまでクラウドの発注カードに
      利確幅・損切り幅pipsは載らない（受入基準A3が未達のまま）。
    実行者: 本人（パブリックリポジトリへの公開操作のため要承認）
    注意: push前に個人情報（メール・氏名入りパス）の混入がないか確認する
  - id: M2
    作業: Coworkへプラグインを導入する
    詳細: 本パッケージ一式をCoworkのプラグインとして読み込ませ、5スキルが呼べる状態にする
  - id: M3
    作業: ルーティン5本を登録する
    詳細: routines/*.yaml の cron で登録。まず fx-watch を先に入れて監視を立ち上げる
  - id: M4
    作業: Mac側launchdとの並走期間を置く
    詳細: >-
      5営業日はMacとクラウドを並走させ、毎朝カードの数字（逆指値・pips幅）が
      一致することを突合する。一致が続いたらMac側を停止してよい。
  - id: M5
    作業: Actionsの失敗通知を有効にする
    詳細: GitHubのActions失敗通知メールをONにし、fx-watchの鮮度検知と二重化する

# ----------------------------------------------------------------------------
# 10. 障害時の動き
# ----------------------------------------------------------------------------
フォールバック:
  - 事象: 鮮度切れ（60分超・非休場）
    対処: >-
      Actionsタブで fx-signals の失敗を確認するよう通知する。
      Coworkは古い数字を最新であるかのように提示してはならない。
      提示する場合は必ず「N分前の値」と明記する。
  - 事象: raw取得が全滅（EGRESS_BLOCKED）
    対処: >-
      宛先がraw.githubusercontent.com以外になっていないか確認する。
      それでも通らない場合はWebSearchで現値のみ取得し、
      「判定はできない・Macまたは指示書メールを確認すること」と伝える。
  - 事象: 当日の指示書がまだ無い
    対処: JST6時台以降に生成される旨を伝え、前日分を誤って提示しない。
  - 事象: 発注カードに幅（pips）欄が無い
    対処: 移行手順M1が未実施である旨を報告し、pipsを自作しない。
