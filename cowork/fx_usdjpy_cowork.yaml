    判定頻度: "15分ごと"
    採用日: "2026-08-13"
    採用スコア: 1.099

# =============================================================================
# 6. リスク・発注カードの計算規約
# =============================================================================
リスク計算:
  唯一の計算元: "src/risk.py の order_widths()"
  禁止: "カード・通知・ボード・メールの各所で幅を再計算すること（片方だけ直し残る事故になる）"
  出力キー:
    - 損切り幅pips
    - 損切り幅円
    - 損切り到達額円
    - 損切り逆行
    - 利確幅pips
    - 利確幅円
    - 利確到達額円
    - RR
  表示規約:
    並び: "利確幅 → 損切り幅 の順で書く"
    利確目標なし: "『─（利確目標を置かない設計）』と表記する"
    保有玉: "『現値からあと何pips』も併記する"
    到達額: "建値基準で計算する。トレール後の逆指値は建値より有利側にあることがあり、その場合は損ではなく確定利益になる"
  ポートフォリオ:
    指標: [建玉数, 合計リスク額円, 合計リスク率, 合計含み損益円, 買建玉, 売建玉, ネット建玉, 両建て度]
    注記: "方向が割れている場合、全ストップ同時到達の単純合計は保守的すぎる。合計とネット建玉を併記する"

# =============================================================================
# 7. データ取得とガード
# =============================================================================
データ:
  価格:
    ソース: "Yahoo Finance（USDJPY=X）"
    日足: "src/data_fetch.py → data/usdjpy_daily.csv"
    時間足: "src/data_fetch_intraday.py（2H） / src/data_fetch_15m.py（1H）"
    既知欠陥:
      名称: "Yahoo日足Closeが1日ずれている"
      発見日: "2026-08-11"
      内容: "High/Lowは正しいが、Closeは前NYクローズの値（符号一致86.7%）"
      対策状況: "ファンダ研究は対策済み。★日足2システム（長期トレンド・短期スイング）は未対策"
      対応方針: "修正は建玉判定を変えるため、必ずユーザー承認を得てから行う。未承認のまま自動修正しない"
      決定待ち: true

  イベントカレンダー:
    ソース: "Forex Factory 週次フィード"
    実装: "src/events.py"
    フィルタ: "『High impact』かつ『★5級イベント名に部分一致』の2段"
    star5パターン:
      # 小文字化した題名への部分一致。この7語以外はHigh impactでも警戒対象にしない
      - "non-farm"                 # 米雇用統計(NFP)
      - "average hourly earnings"  # 平均時給（雇用統計同時発表）
      - "fomc"                     # FOMC声明・会見・議事要旨
      - "federal funds rate"       # 米政策金利
      - "cpi"                      # 米消費者物価指数
      - "boj"                      # 日銀（政策金利・会見）
      - "monetary policy"          # 金融政策（日銀声明等）
    参照範囲: "今後24時間"
    キャッシュ:
      フレッシュ時間: 3
      ステール許容時間: 72
      理由: "キャッシュせず毎回叩くと HTTP 429 になり『カレンダー取得失敗』が常態化して★5級イベント直前の新規停止がかからなくなる"
      保存形式: '{"fetched": ISO8601, "data": [...]}'
      保存先: "results/cache/*.json"
    取得失敗時: "新規見送りは行わず、指示書に『手動確認推奨』と記す。通知末尾に『⚠指標カレンダー取得失敗』を付記する"

  鮮度ガード:
    条件: "最終確定バーの経過時間 > 時間足×2 + 30分 なら stale"
    動作: "stale の時は新規建ての判定を出さない（休場中なら正常。平日ならデータ障害）"
    実装状況:
      intraday_15m: "実装済み（src/intraday15_engine.py）"
      intraday_2h: "★未実装 — 是正項目P1参照"
      日足2システム: "3段階配信そのものが鮮度の代替になっている（6時速報は米国冬時間期に未確定バーの暫定値になる点を明記済み）"

ガード:
  指標フィルタ:
    有効: true
    動作: "今後24時間に★5級イベントがある日は、全システムの新規建てを自動で【見送り】にする"
    例外: "既存玉の決済・トレイルは通常どおり行う"
  米国冬時間:
    期間: "11月〜3月"
    影響: "日足確定が7時になるため、6時の速報①は未確定バーによる暫定値。動作自体は正常"

# =============================================================================
# 8. 状態ファイルと冪等性
# =============================================================================
状態:
  ファイル:
    - パス: state.json
      対象: "長期トレンド・短期スイング"
      キー: [position, entry, stop, units, best, entry_date]
      更新契機: "最終確定（stage 3）のみ。速報①②では更新しない"
    - パス: state_intraday.json
      対象: "デイトレ2H"
      キー: [state, last_bar, last_close, updated]
    - パス: state_intraday15.json
      対象: "デイトレ15分"
      キー: [state, last_bar, last_close, updated]
  冪等性:
    日足: "results/orders/{日付}_指示_{段階}.txt の存在をもって生成済みと判定し、再実行しない"
    デイトレ: "未処理の確定バーだけを処理する。同じバーは二度判定しない"
    メール: "results/orders/{日付}_mail_確定.sent マーカーで1日1通に制限"
    予測: "forecast_log.csv は同じ基準日の二重記録を自前で弾く"
  クラウド移行時の注意: "Actions版へ切り替える際は state*.json を必ずシードする。純リプレイでは日足2システムの建値が0.3円ズレ数量も1ロット違う（Mac版は朝8時の未確定バーの暫定終値で建玉するため履歴からは再現不能）"

# =============================================================================
# 9. スケジュール
# =============================================================================
スケジュール:
  タイムゾーン: "Asia/Tokyo"

  github_actions:
    - ワークフロー: signals.yml
      名前: fx-signals
      cron_utc: "5,20,35,50 * * * 0-5"
      意味: "UTC日曜〜金曜の15分ごと ＝ JST月6:05〜土8:50"
      注意: "UTC月〜金(1-5)にするとJST月曜朝6〜9時が抜ける"
      タイムアウト分: 15
      同時実行: "group=fx-signals / cancel-in-progress=false"
      ステップ:
        - "デイトレ15分（run_intraday15.py）"
        - "デイトレ2H（run_intraday.py）"
        - "日足2システム（JST6-8時台のみ run_morning.py）"
        - "state・resultsをコミット＆push"
      設計理由: "全シグナル系を1ジョブに集約し、チェックアウト／pip導入のコストを1回で済ませる。各ラッパは冪等なので多めに回して取りこぼしを潰す"
    - ワークフロー: research.yml
      名前: fx-research
      cron_utc: "0 6 * * 1-5"
      意味: "JST15:00（平日）"
      タイムアウト分: 90
      ステップ:
        - "日足2システムの研究（research.py）"
        - "デイトレ2Hの研究（research_intraday.py）"
        - "デイトレ15分の研究（research_15m.py）"
        - "ファンダ・予測研究（research_fundamental.py）"
        - "config.json の差分から進化の有無を表示"
        - "研究結果をコミット＆push"

  cowork_routines:
    - id: morning-daily
      名称: "FXドル円 朝の3段階配信"
      起動: "平日 6:06 / 7:06 / 8:06 JST"
      役割: "公開・通知・研究（成果物生成はActions側が担当）"
      ランブック: morning_daily
    - id: intraday-2h
      名称: "FXドル円 デイトレ2H"
      起動: "平日 7〜23時の毎時6分 JST"
      役割: "未通知の判定だけをプッシュ通知し既読化する"
      ランブック: intraday_2h
    - id: intraday-15m
      名称: "FXドル円 デイトレ15分"
      起動: "毎時 4/19/34/49分 JST"
      役割: "未通知の判定だけをプッシュ通知し既読化する"
      ランブック: intraday_15m
    - id: fundamental
      名称: "FXドル円 ファンダ・予測研究"
      起動: "平日 6/9/12/15/18/21時台 JST"
      役割: "ニュース収集＋定量研究。発注判断は一切しない"
      ランブック: fundamental
    - id: daily-research
      名称: "FXドル円 日次研究"
      起動: "平日 15時台 JST（Actions research.yml の完了後）"
      役割: "パラメータ進化の確認＋3観点点検＋必ず1通配信"
      ランブック: daily_research
    - id: weekly-pair
      名称: "FXドル円 週次ペア研究"
      起動: "毎週土曜 9時 JST"
      役割: "11通貨ペア横断でドル円の優位性を検証"
      ランブック: weekly_pair

  現行mac_launchd_対応表:
    - ラベル: com.<user>.fx-signal
      起動: "平日 6:03 / 7:03 / 8:03"
      コマンド: "python3 src/run_morning.py"
      クラウド移行先: "signals.yml の『日足2システム』ステップ"
    - ラベル: com.<user>.fx-intraday
      起動: "毎時 3分"
      コマンド: "python3 src/run_intraday.py"
      クラウド移行先: "signals.yml の『デイトレ2H』ステップ"
    - ラベル: com.<user>.fx-intraday15
      起動: "毎時 4/19/34/49分"
      コマンド: "python3 src/run_intraday15.py"
      クラウド移行先: "signals.yml の『デイトレ15分』ステップ"
  停止手順: "5営業日の並走で state 一致を確認してから launchctl unload する。Mac版コードは照合用に残す"

# =============================================================================
# 10. ランブック（タスクごとの実行手順）
# =============================================================================
ランブック:

  morning_daily:
    名称: "朝の3段階配信（日足2システム）"
    起動: "平日 6時台・7時台・8時台"
    段階:
      1: {タグ: 速報1, 表示: 速報①, 正式: false, 状態更新: false}
      2: {タグ: 速報2, 表示: 速報②, 正式: false, 状態更新: false}
      3: {タグ: 確定, 表示: 最終確定, 正式: true, 状態更新: true}
    段階判定: "6時台→1 / 7時台→2 / それ以外→3"
    実行コマンド: 'cd "$HOME/FXドル円自動売買スキーム" && python3 src/run_morning.py'
    ラッパの責務:
      - "現在時刻から対象ステージを自動判定する"
      - "当日の未生成ステージを手前から順に追いつき生成する（追いつき生成はその旨を指示書末尾に明記）"
      - "生成済みステージは再実行しない（冪等・日次ログの二重追記を防ぐ）"
      - "失敗時は90秒待って最大2回リトライする（計3試行）"
      - "1試行の上限は300秒。2026-08-12にエンジンが約63分ハングし最終確定が9:34まで遅れた事故が根拠"
      - "成否を results/run_log.csv に必ず記録する"
      - "成果物の実在をもって成功と判定する（終了コードだけでは信用しない）"
    最終確定のみ行う処理:
      - "state.json の更新"
      - "daily_log.csv への追記"
      - "Driveの『FXドル円自動売買』フォルダへ指示書コピー（Mac専用・失敗しても配信は継続）"
      - "運用ダッシュボード xlsx の更新"
      - "指示書メールの自動送信（1日1通）"
    手順:
      - 順: 1
        名称: "ラッパ実行"
        内容: "上記コマンドを1回叩く。終了コードが0以外＝対象ステージの指示書を出せていない。この場合は必ずエラー通知を行う"
      - 順: 2
        名称: "★最優先：Webボードを直ちに公開する"
        内容: "研究や点検より必ず先に行う。2026-08-10に公開が研究の後回しになり8:46まで遅延した事故の再発防止"
        詳細: "results/dashboard_web.html はエンジンが全ステージで自動再生成済み。更新時刻が古い場合のみ python3 src/dashboard_web.py で再生成する"
      - 順: 3
        名称: "指示書の読み取り"
        内容: "『=== 本日の指示書 ===』以下から両システムのアクションと指標イベント欄を読む。『=== 完成率 ===』も確認する"
      - 順: 4
        名称: "プッシュ通知"
        内容: "段階タグを先頭に付け、『長期=◯◯／短期=◯◯』形式で1〜2行にまとめる"
      - 順: 5
        名称: "速報②のみ：速報①との差分明記"
        内容: "results/orders/{本日}_指示_速報1.txt と比較し、変化の有無を本文に明記する"
      - 順: 6
        名称: "最終確定のみ：日次研究と3観点点検"
        内容: "ランブック daily_research を実行する"
    エラー時: "終了コードが0以外、または対象ステージの指示書が無い場合は【エラー】として通知する。最終確定のエラーは『本日の正式指示を配信できていない』ことを必ず明記する"

  intraday_2h:
    名称: "デイトレ複合時間軸（2H）"
    起動: "平日 7〜23時の毎時"
    現況確認コマンド: 'cd "$HOME/FXドル円自動売買スキーム" && python3 src/run_intraday.py --status'
    注記: "--status はエンジンを再実行せず状態を読むだけ"
    手順:
      - "JSONの『未通知』配列を確認する。空なら通知不要（大半の回はこれが正常）"
      - "『更新』時刻が3時間以上前ならエンジンが止まっている可能性があるため run_intraday.py を1回実行して追いつかせ、その旨を出力に残す（週明け月曜朝は休場スキップの名残で古くても正常）"
      - "未通知が1件以上ある場合のみプッシュ通知する。複数件は1通にまとめる"
      - "通知したら必ず既読化する: python3 src/intraday_engine.py --ack-all"
    pips転記元: "results/intraday_latest.txt の発注カード『──── 幅（pips）────』欄"

  intraday_15m:
    名称: "デイトレ15分（実体は1時間足）"
    起動: "毎時 4/19/34/49分"
    現況確認コマンド: 'cd "$HOME/FXドル円自動売買スキーム" && python3 src/run_intraday15.py --status'
    手順: "intraday_2h と同一。既読化は python3 src/intraday15_engine.py --ack-all"
    pips転記元: "results/intraday15_latest.txt の発注カード『──── 幅（pips）────』欄"

  fundamental:
    名称: "ファンダ・予測研究"
    起動: "平日 6/9/12/15/18/21時台"
    役割: "ファンダ／予測のみ。テクニカルのパラメータ探索は daily_research が担当。発注判断は一切しない"
    手順:
      - 順: 1
        名称: "定性ニュース収集（WebSearch）"
        内容: "results/fundamental_news.json を上書きする"
        朝一6時台: "2〜3クエリで広めに。前日NY時間の値動き理由・当日の日程・要人発言・介入観測・地政学まで押さえる"
        更新回: "1〜2クエリの差分更新でよい。変化が無ければ総括を現状維持で書き直し更新時刻だけ進める"
        スキーマ: [更新, 収集元, 総括, "テーマ[見出し・要旨・含意・重要度]", 次の焦点, 保有ポジションへの含意]
        含意の値域: [円安, 円高, 中立, 両方向リスク]
        重要度の値域: "1〜5"
      - 順: 2
        名称: "定量研究"
        内容: "python3 src/research_fundamental.py（約1分）。マクロ連関→レジーム判定→翌日方向・変動幅のウォークフォワード検証→当日予測を forecast_log.csv に記録し翌日以降に自動採点する"

  daily_research:
    名称: "日次研究（パラメータ自動進化＋3観点点検）"
    起動: "平日 15時台（最終確定配信後でも可）"
    所要: "約3分（日足2システム分）"
    実行コマンド: "python3 src/research.py"
    パラメータ探索:
      対象データ: "15年日足（data/usdjpy_daily.csv）"
      前後半分割: "2018-12-31"
      スコア: "min(前半PF, 後半PF)"
      採用条件: "頑健性ゲートを全て満たし、かつ 現行スコア×1.05 以上"
      共通ゲート:
        最大DD下限: -0.12
        改善比: 1.05
      システム別ゲート:
        長期トレンド:
          entry候補: [10, 15, 20, 25, 30, 40, 55]
          exit候補: [5, 8, 10, 15, 20]
          atr候補: [2.5, 3.0, 3.5]
          最小取引数: 60
          前後半PF下限: 1.3
        短期スイング:
          entry候補: [5, 8, 10, 15, 20, 25]
          exit候補: [3, 4, 5, 8, 10]
          atr候補: [1.5, 2.0, 2.5]
          最小取引数: 250
          前後半PF下限: 1.25
          注記: "250回/15.5年 ≒ 年16回以上。これを下回る候補は『回転を上げる』役割違いとして不採用"
      採用時の動作: "config.json を書き換え（翌朝から適用）→ research_log.csv に記録 → ダッシュボード再生成"
      採用時の追加作業: "進化があれば追加のプッシュ通知を送り、Webボードを再生成して再公開する"
    点検3観点:
      - 観点: 信用性
        内容:
          - "前日の指示と実際の値動きの整合"
          - "データ欠損・遅延の有無"
          - "指標イベント判定の妥当性"
          - "state.json のモデルポジと実口座の乖離"
      - 観点: 運営
        内容:
          - "results/run_log.csv と完成率欄で欠落・リトライ・失敗の発生状況を確認"
          - "完成率が100%未満の日があれば原因を調べ再発防止を報告に含める"
          - "Webボード公開の遅延・失敗もここで点検する"
          - "完成率が直近10営業日で100%でない場合は通知末尾に『完成率◯/◯』を付記する"
      - 観点: 表示
        内容:
          - "公開直後のボードHTMLを実際に読み、指示書本文・state.json・trades.csv と矛盾していないか確認"
          - "レート・更新時刻・完成率チップが当該ステージのものに更新されているか"
          - "見づらい・誤解を招く・情報が足りない箇所を毎日1点以上探す。軽微なら即改修し、大掛かりなら改善案として報告する"
    義務: "パラメータ探索だけで終わらせない。3観点の点検は必須要件"
    失敗時: "研究の失敗はシグナル配信に影響しないため、翌日に持ち越してよい（通知不要）"

  weekly_pair:
    名称: "週次ペア研究"
    起動: "毎週土曜9時（市場休場中）"
    実行コマンド: "python3 src/pair_scan.py --tuned 2"
    所要: "約2〜4分"
    内容: "主要11通貨ペアの15年日足を取得し、現行2システム（config.jsonに自動追随）で頑健性検証。ドル円以外の上位2ペアには専用パラメータ最適化も行う"
    出力: "results/pair_scan.csv（最新）／pair_scan_log.csv（履歴）／Driveダッシュボード『ペア研究』シート"
    判定パターン:
      ドル円優位継続: "簡潔に週次サマリを通知"
      接近: "『◯◯がドル円の9割圏内に接近。来週も監視』"
      要注目: "『◯◯がドル円に並ぶ/超えるスコア。乗換え/追加の検討候補』。JFX公式スプレッド一覧での実スプレッド確認が必要な旨を添える"
    禁止: "config.json への新ペア追加。ペア追加や乗換えは必ずユーザーの判断を仰ぐ"
    リトライ: "Yahooが500を返すことがある。一部ペア失敗時は5分待って再実行、最大2回"

# =============================================================================
# 11. 通知
# =============================================================================
通知:
  チャネル:
    push:
      ツール: "PushNotification（status: proactive）"
      本数制限: "1回の起動で1〜2通に抑える。複数システムに動きがあれば1通にまとめる"
      無通知: "発注不要の回は通知しない。静かに終えるのが正しい"
    mail:
      対象: "最終確定の指示書のみ"
      実装: "src/mailer.py（run_morning.py から自動呼び出し）"
      宛先: "本人固定（local_settings 経由。外部宛には送れない）"
      経路: "gmail SMTP → icloud SMTP → Outlookデスクトップ(AppleScript) の順に自動フォールバック"
      現行実働経路: "Gmail SMTP"
      本文形式: "平文＋等幅<pre>HTMLのmultipart/alternative（可変幅フォントで発注カードの桁が崩れるのを防ぐ）"
      冪等: "results/orders/{日付}_mail_確定.sent マーカーで1日1通"
      点検: "ラッパ出力の『[メール]』行を必ず確認し、失敗していれば通知末尾に『⚠メール送信失敗』を付記する"
      認証確認: "python3 src/mailer.py --verify（メールは送らない）"
      クラウド注意: "Outlook経路はMac専用。Actions/Cowork では Gmail SMTP のみが有効"
    board:
      ツール: "Artifact"
      file_path: "$HOME/FXドル円自動売買スキーム/results/dashboard_web.html"
      url: "https://claude.ai/code/artifact/fc8dd94c-6df0-4c02-a8be-72787cad9504"
      favicon: "📈"
      規約: "必ず同一URLを指定する。新規URL発行は禁止。faviconも変更しない"
      409時: "python3 src/dashboard_web.py で再生成してから force:true で再公開してよい（全文自動生成のためマージ不要・常に最新の再生成が正）"
      失敗時: "通知末尾に『⚠Webボード更新失敗』を必ず付記する"
      速報中の表示: "『速報配信中——正式な発注判断は8時すぎの最終確定で』バナーが自動表示される"
      暫定反映: "速報中は当日ストップ到達分を『（暫定）』付きで損益に加算し、8時最終確定の正式計上と二重計上しない設計"

  pips併記規約:
    根拠: "2026-08-18ユーザー指示"
    対象: "逆指値・利確を載せる全ての通知"
    並び: "利確幅 → 損切り幅"
    計算元: "指示書の発注カード『──── 幅（pips）────』欄をそのまま転記する。自分で計算しない"
    利確なし設計: "日足2系統は『─』"

  テンプレート:
    速報1: "【速報①6時】ドル円: 長期=◯◯／短期=◯◯ → 発注は8時の最終確定で"
    速報2: "【速報②7時】（速報①からの変化有無を明記）→ 発注は8時の最終確定で"
    最終確定_要発注: "【最終確定・要発注】ドル円: 長期=逆指値162.10円へ変更（損切り幅48pips）／短期=新規買 5,000通貨・逆指値162.78円（損切り幅136pips・利確幅─＝利確目標なし設計）"
    最終確定_不要: "【最終確定】ドル円: 両システムとも待機（または継続）。発注不要"
    デイトレ_新規: "【デイトレ・要発注】ドル円: 新規売 4,000通貨・成行→OCO（逆指値158.88円／利確155.95円｜利確幅124pips・損切り幅62pips）（試験運転）"
    デイトレ_決済: "【デイトレ・要発注】ドル円: 売ポジ全決済（OCO取消→成行）"
    デイトレ_ストップ変更: "【デイトレ】逆指値を157.90円へ変更（損切り幅26pips・利確はそのまま）"
    デイトレ_利確設定: "【デイトレ・要発注】既存ポジに利確指値155.95円を追加（利確幅124pips・逆指値とOCO化）"
    デイトレ_到達確認: "【デイトレ】ストップ158.88円到達。約定確認を"
    週次ペア: "【週次ペア研究】ドル円優位継続（長期score◯◯、次点◯◯ ◯◯）。全11ペア検証済"
    エラー: "【エラー】ドル円: ◯◯（原因の一行要約）"

  付記ルール:
    - 条件: "★5級イベントで新規見送りが発生、または今後24時間に高重要度イベントがある"
      付記: "⚠今夜◯時 FOMC"
    - 条件: "指標カレンダー取得失敗"
      付記: "⚠指標カレンダー取得失敗"
    - 条件: "データ鮮度不足"
      付記: "⚠データ鮮度不足"
    - 条件: "Webボード公開失敗"
      付記: "⚠Webボード更新失敗"
    - 条件: "メール送信失敗"
      付記: "⚠メール送信失敗"
    - 条件: "完成率が直近10営業日で100%未満"
