    利確: "指値を必ず置く（OCO化）"
    通知時間帯: [7, 23]
    判定頻度: "毎時"
    検証実績:
      期間: "2.8年"
      PF: 1.38
      勝率: 0.419
      最大DD: -0.030
      回転: "約0.4回転/日"

  - id: intraday_15m
    番号: 4
    名称: "デイトレ15分"
    有効: true
    試験運転: true
    時間足: "実体は1時間足（判定を15分ごとに回すという意味の名称）"
