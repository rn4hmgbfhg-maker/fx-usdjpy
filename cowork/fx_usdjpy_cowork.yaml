# =============================================================================
# 16. 詰まりどころ（再発必至・移行時に必ず読む）
# =============================================================================
既知の落とし穴:
  - 事象: ".github/workflows/ への git push と REST contents API が両方404で拒否される"
    原因: "OAuthトークンに workflow スコープが無い。gh auth refresh -s workflow はブラウザ認証必須"
    回避: "GitHub Web UI 上の操作は本人扱いで制限を受けないので、そちらで設置する"
  - 事象: "Web UI でも ../ を使ったファイル移動が『malformed path component』で拒否される"
    回避: "新規作成URLの事前入力を使う: https://github.com/OWNER/REPO/new/main?filename=<パス>&value=<URLエンコード本文>（/edit/ では value は効かない）"
  - 事象: "Linux で osascript が無く、subprocess.run(check=False) でも FileNotFoundError で落ちる"
    回避: "3エンジンの通知関数に sys.platform != 'darwin' ガードを入れる（対応済み）"
  - 事象: "Linux でキーチェーン（security コマンド）が無い"
    回避: "mailer は環境変数フォールバックを持つ（対応済み）"
  - 事象: "git push が『could not read Username』で失敗する"
    回避: "gh auth setup-git を実行する"
  - 事象: "cron が定刻を保証せず遅延・スキップする"
    回避: "15分ごとに回し『未処理の確定バーだけ処理』で冪等化する（対応済み）"
  - 事象: "Forex Factory フィードで HTTP 429"
    回避: "3時間フレッシュ／72時間ステールのファイルキャッシュ（対応済み）"
  - 事象: "Macがスリープしていると launchd が遅延する"
    回避: "モードAへ移行すれば解消する。モードB運用中は通知に『⚠Macスリープにより遅延』を付記する"

