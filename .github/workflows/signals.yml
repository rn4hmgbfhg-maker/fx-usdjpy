name: fx-signals

# 全シグナル系を1ジョブに集約して毎時回す。
# ・チェックアウト／pip導入のコストを1回で済ませる
# ・各ラッパは冪等なので多めに回して取りこぼしを潰す
on:
  schedule:
    # UTC日曜〜金曜の15分ごと ＝ JST月6:05〜土8:50
    # ★UTC月〜金(1-5)だとJST月曜朝6〜9時が抜ける
    - cron: '5,20,35,50 * * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TZ: Asia/Tokyo
      FX_GMAIL_APP_PASSWORD: ${{ secrets.FX_GMAIL_APP_PASSWORD }}
      FX_GMAIL_ACCOUNT: ${{ secrets.FX_GMAIL_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-09-27: 既定では「起動要求時点」のコミットを取るため、Mac起動分と
          # cron分が続けて並ぶと後発ランが先発の送信済みマーカーを見られず再送していた。
          # ジョブ開始時点の最新 main を取る。
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # 2026-10-19: GitHub の cron は実測2〜5時間に1回しか動かず、15分ごとの起動は Mac（launchd）頼みだった。
      # 10/17 早朝に Mac 側が止まり、シグナル・ボード・現在値がすべて止まった（落合さん指摘「更新スキームが壊れてる」）。
      # 1回の起動の中で15分ごとに処理を繰り返し（最長5時間半）、次の cron 起動へつなぐ。Mac が動いていれば
      # Mac の起動分は待ち行列に入り、ループ終了後にそのまま引き継ぐ（同時には走らない）。
      - name: 15分ごとループ（1回の起動で最長5時間半）
        run: |
          START=$(date +%s)
          while true; do
            git pull -q --rebase -X theirs origin main || git rebase --abort 2>/dev/null || true
            pip install -q -r requirements.txt || true
            bash scripts/actions_tick.sh || echo "⚠この回の処理に失敗（次の回へ）"
            # 休場（JST 土9:00〜月6:00）に入ったら終える
            DOW=$(TZ=Asia/Tokyo date +%u); HH=$(TZ=Asia/Tokyo date +%H)
            if { [ "$DOW" = 6 ] && [ "$HH" -ge 9 ]; } || [ "$DOW" = 7 ] || { [ "$DOW" = 1 ] && [ "$HH" -lt 6 ]; }; then
              echo "休場のため終了"; break
            fi
            # 次の :04 / :19 / :34 / :49（JST）まで待つ。合計5時間半を超えるなら終えて次の起動へ
            NOW=$(date +%s); M=$(( (NOW / 60) % 15 )); S=$(( NOW % 60 ))
            WAIT=$(( ((4 - M + 15) % 15) * 60 - S )); [ "$WAIT" -le 30 ] && WAIT=$(( WAIT + 900 ))
            if [ $(( NOW + WAIT - START )) -gt 19800 ]; then echo "5時間半に達したため終了"; break; fi
            echo "次の回まで ${WAIT}秒待機"
            sleep "$WAIT"
          done
