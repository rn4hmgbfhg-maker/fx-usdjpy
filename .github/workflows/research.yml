name: fx-research

# 日次研究（パラメータ探索と自動進化）。
# ★パブリックはActions無料枠無制限なので実測19分＋16分の探索も寄せられる
on:
  schedule:
    - cron: '0 6 * * 1-5'     # UTC 6:00 = JST 15:00（平日）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Tokyo
      FX_GMAIL_APP_PASSWORD: ${{ secrets.FX_GMAIL_APP_PASSWORD }}
      FX_MAIL_TO: ${{ secrets.FX_MAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 日足2システムの研究
        run: python3 src/research.py
        continue-on-error: true

      - name: デイトレ2Hの研究
        run: python3 src/research_intraday.py
        continue-on-error: true

      - name: デイトレ15分の研究
        run: python3 src/research_15m.py
        continue-on-error: true

      - name: ファンダ・予測研究
        run: python3 src/research_fundamental.py
        continue-on-error: true

      - name: 進化の有無を表示
        run: |
          if git diff --quiet config.json; then
            echo "::notice::パラメータ進化なし（現行維持）"
          else
            echo "::warning::パラメータ進化あり。docs/クラウド運用プロンプト/01〜03 の定数を更新すること"
            git diff config.json
          fi

      - name: 研究結果をコミット
        run: |
          git config user.name  "fx-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A config.json results data
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "research $(TZ=Asia/Tokyo date +'%F JST')"
            git push
          fi
